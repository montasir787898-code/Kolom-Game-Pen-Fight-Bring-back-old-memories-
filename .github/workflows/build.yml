name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - run: pip install pillow && python3 make_icon.py && python3 -c "from PIL import Image; Image.new('RGB',(1024,1024),(31,61,43)).save('assets/icon-background.png')"
        continue-on-error: true
      - run: npm install --save-dev @capacitor/assets && npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk kolom-juddho.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: কলম যুদ্ধ v1.${{ github.run_number }}
          files: kolom-juddho.apk
